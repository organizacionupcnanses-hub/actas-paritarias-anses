name: Recolectar Actas Paritarias ANSES

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 AM hora Argentina (UTC-3)
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  actualizar-actas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Recolectar PDFs y generar actas.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/recolectar_actas.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "UPCN Actas Bot"
          git config user.email "bot@users.noreply.github.com"
          git add pdfs/ actas.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Actualización automática de Actas Paritarias ($(date +'%Y-%m-%d'))"
            git push
          else
            echo "Sin actas nuevas."
          fi
